name: NEXUS FORGE Verified Backup Capture

on:
  # Recurring timer capture enabled by the operator's finish-everything instruction on 2026-10-22.
  # Cron is UTC: 07:00 UTC is 03:00 America/New_York during daylight time (04:00 in winter).
  # Manual runs still require confirm_live_export=true in the dispatch form; nothing else changed.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      confirm_live_export:
        description: "Confirm this workflow will export the configured Live Convex deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nexus-forge-live-backup-capture
  cancel-in-progress: false

jobs:
  # Scheduled runs are automatic; manual runs require explicit confirmation.
  confirmation-required:
    name: Live export not confirmed - no backup taken
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_export != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unconfirmed Live export
        shell: bash
        run: |
          echo "::error::No backup was taken. Live export requires confirm_live_export=true in the dispatch form."
          {
            echo "## No backup taken"
            echo "confirm_live_export was not true, so the Live Convex export did not run."
            echo "Nothing was exported, uploaded or verified. This run is not a backup."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  capture-verify-store:
    name: Export, independently retrieve, and verify backup
    if: ${{ github.event_name == 'schedule' || inputs.confirm_live_export == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.BACKUP_S3_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
      # S3-compatible stores such as Supabase Storage do not accept the flexible
      # checksum headers (x-amz-checksum-*, aws-chunked trailers) that newer AWS CLI v2
      # releases send by default. Integrity is proven by the independent SHA-256 retrieval
      # comparison below, not by provider checksums.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout backup verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require explicitly configured private backup destination
        shell: bash
        env:
          CONFIRM_LIVE_EXPORT: ${{ inputs.confirm_live_export }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$CONFIRM_LIVE_EXPORT" != "true" ]]; then
            echo "::error::Manual Live export requires confirm_live_export=true."
            exit 1
          fi
          missing=0
          for name in CONVEX_DEPLOY_KEY BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY BACKUP_S3_BUCKET BACKUP_S3_REGION; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret/variable is missing: $name"
              missing=1
            fi
          done
          [[ "$missing" == "0" ]] || exit 1
          if [[ "$BACKUP_S3_BUCKET" == *"/"* || "$BACKUP_S3_BUCKET" == *".."* || "$BACKUP_S3_BUCKET" == *":"* ]]; then
            echo "::error::BACKUP_S3_BUCKET must be a plain bucket name, not a path or URL."
            exit 1
          fi
          if [[ -n "${BACKUP_S3_ENDPOINT:-}" && ! "$BACKUP_S3_ENDPOINT" =~ ^https:// ]]; then
            echo "::error::BACKUP_S3_ENDPOINT must be an https:// URL when set."
            exit 1
          fi
          if [[ "${BACKUP_S3_ENDPOINT:-}" == *"supabase"* && ! "$BACKUP_S3_ENDPOINT" =~ ^https://[a-z0-9]+\.(storage\.)?supabase\.co/storage/v1/s3$ ]]; then
            echo "::error::Supabase BACKUP_S3_ENDPOINT must be exactly https://<project-ref>.storage.supabase.co/storage/v1/s3 (no trailing slash, no bucket name)."
            exit 1
          fi
          if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then
            aws configure set default.s3.addressing_style path
          fi
          echo "Required settings are present; values are not printed."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export configured Live Convex deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexus-backup"
          npx --yes convex@1.41.0 export --include-file-storage --path "$RUNNER_TEMP/nexus-backup/source.zip" --prod
          test -s "$RUNNER_TEMP/nexus-backup/source.zip"

      - name: Prepare unique private object keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          CAPTURED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CAPTURE_KEY="live-${CAPTURED_AT//:/}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARCHIVE_KEY="nexus-forge/live/$CAPTURE_KEY.zip"
          echo "captured_at=$CAPTURED_AT" >> "$GITHUB_OUTPUT"
          echo "capture_key=$CAPTURE_KEY" >> "$GITHUB_OUTPUT"
          echo "archive_key=$ARCHIVE_KEY" >> "$GITHUB_OUTPUT"
          echo "report_key=$ARCHIVE_KEY.verification.json" >> "$GITHUB_OUTPUT"
          echo "receipt_key=nexus-forge/receipts/$CAPTURE_KEY.json" >> "$GITHUB_OUTPUT"

      - name: Upload archive to private S3-compatible storage
        id: upload
        shell: bash
        env:
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
        run: |
          set -euo pipefail
          s3() { if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then aws "$@" --endpoint-url "$BACKUP_S3_ENDPOINT"; else aws "$@"; fi; }
          SOURCE="$RUNNER_TEMP/nexus-backup/source.zip"
          SOURCE_SHA="$(sha256sum "$SOURCE" | cut -d' ' -f1)"
          SOURCE_BYTES="$(stat -c '%s' "$SOURCE")"
          if s3 s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$ARCHIVE_KEY" >/dev/null 2>"$RUNNER_TEMP/nexus-backup/head.err"; then
            echo "::error::Destination key already exists; refusing to overwrite or verify a stale object."
            exit 1
          elif ! grep -Eq '\(404\)|Not Found|NoSuchKey' "$RUNNER_TEMP/nexus-backup/head.err"; then
            echo "::error::Could not confirm the destination key is free (storage returned an error other than Not Found):"
            head -c 500 "$RUNNER_TEMP/nexus-backup/head.err"
            exit 1
          fi
          s3 s3api put-object --bucket "$BACKUP_S3_BUCKET" --key "$ARCHIVE_KEY" --body "$SOURCE" --output json > "$RUNNER_TEMP/nexus-backup/put-object.json"
          ETAG="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("ETag","").strip(chr(34)))' "$RUNNER_TEMP/nexus-backup/put-object.json")"
          VERSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("VersionId",""))' "$RUNNER_TEMP/nexus-backup/put-object.json")"
          [[ -n "$ETAG" ]] || { echo "::error::Upload did not return an object ETag; upload completion is unconfirmed."; exit 1; }
          {
            echo "source_sha256=$SOURCE_SHA"
            echo "source_bytes=$SOURCE_BYTES"
            echo "etag=$ETAG"
            echo "version_id=$VERSION_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Uploaded archive: key=$ARCHIVE_KEY bytes=$SOURCE_BYTES sha256=$SOURCE_SHA"

      - name: Independently retrieve saved archive and verify exact bytes
        id: integrity
        shell: bash
        env:
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
          REPORTED_SHA: ${{ steps.upload.outputs.source_sha256 }}
          REPORTED_BYTES: ${{ steps.upload.outputs.source_bytes }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          s3() { if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then aws "$@" --endpoint-url "$BACKUP_S3_ENDPOINT"; else aws "$@"; fi; }
          RETRIEVED_DIR="$(mktemp -d "$RUNNER_TEMP/nexus-retrieved-XXXXXX")"
          VERSION_ARGS=()
          [[ -n "$VERSION_ID" ]] && VERSION_ARGS=(--version-id "$VERSION_ID")
          s3 s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$ARCHIVE_KEY" "${VERSION_ARGS[@]}" --output json > "$RETRIEVED_DIR/head.json"
          REMOTE_BYTES="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ContentLength"])' "$RETRIEVED_DIR/head.json")"
          s3 s3api get-object --bucket "$BACKUP_S3_BUCKET" --key "$ARCHIVE_KEY" "${VERSION_ARGS[@]}" "$RETRIEVED_DIR/retrieved.zip" > /dev/null
          test -s "$RETRIEVED_DIR/retrieved.zip"
          python3 scripts/backup-receipt.py compare --source "$RUNNER_TEMP/nexus-backup/source.zip" --retrieved "$RETRIEVED_DIR/retrieved.zip" --reported-sha256 "$REPORTED_SHA" --reported-bytes "$REPORTED_BYTES" --remote-bytes "$REMOTE_BYTES" | tee "$RETRIEVED_DIR/comparison.json"
          if ! cmp --silent "$RUNNER_TEMP/nexus-backup/source.zip" "$RETRIEVED_DIR/retrieved.zip"; then
            echo "::error::Retrieved archive is not byte-identical to the uploaded source."
            exit 1
          fi
          echo "retrieved_path=$RETRIEVED_DIR/retrieved.zip" >> "$GITHUB_OUTPUT"
          echo "Retrieved archive: bytes=$REMOTE_BYTES matches pre-upload sha256=$REPORTED_SHA"

      - name: Verify ZIP structure, tables, relationships and freshness
        shell: bash
        env:
          RETRIEVED_PATH: ${{ steps.integrity.outputs.retrieved_path }}
          CAPTURED_AT: ${{ steps.keys.outputs.captured_at }}
          EXPECTED_SHA256: ${{ steps.upload.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/check-recovery-point.py --archive "$RETRIEVED_PATH" --source "$RUNNER_TEMP/nexus-backup/source.zip" --expected-sha256 "$EXPECTED_SHA256" --captured-at "$CAPTURED_AT" --report "$RUNNER_TEMP/nexus-backup/verification.json"

      - name: Upload verification report
        if: always() && steps.upload.outputs.source_sha256 != ''
        shell: bash
        env:
          REPORT_KEY: ${{ steps.keys.outputs.report_key }}
        run: |
          set -euo pipefail
          s3() { if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then aws "$@" --endpoint-url "$BACKUP_S3_ENDPOINT"; else aws "$@"; fi; }
          if [[ ! -s "$RUNNER_TEMP/nexus-backup/verification.json" ]]; then
            printf '{"version":"recovery-point-verification-v1","passed":false,"failureCode":"VERIFICATION_REPORT_MISSING","restorePerformed":false}\n' > "$RUNNER_TEMP/nexus-backup/verification.json"
          fi
          s3 s3 cp "$RUNNER_TEMP/nexus-backup/verification.json" "s3://$BACKUP_S3_BUCKET/$REPORT_KEY" --only-show-errors

      - name: Write receipt only after capture and retrieval checks pass
        if: success()
        shell: bash
        env:
          CAPTURE_KEY: ${{ steps.keys.outputs.capture_key }}
          CAPTURED_AT: ${{ steps.keys.outputs.captured_at }}
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
          REPORT_KEY: ${{ steps.keys.outputs.report_key }}
          RECEIPT_KEY: ${{ steps.keys.outputs.receipt_key }}
          REPORTED_SHA: ${{ steps.upload.outputs.source_sha256 }}
          REPORTED_BYTES: ${{ steps.upload.outputs.source_bytes }}
          ETAG: ${{ steps.upload.outputs.etag }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          RETRIEVED_PATH: ${{ steps.integrity.outputs.retrieved_path }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: |
          set -euo pipefail
          s3() { if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then aws "$@" --endpoint-url "$BACKUP_S3_ENDPOINT"; else aws "$@"; fi; }
          python3 scripts/backup-receipt.py build --archive "$RUNNER_TEMP/nexus-backup/source.zip" --retrieved "$RETRIEVED_PATH" --report "$RUNNER_TEMP/nexus-backup/verification.json" --reported-sha256 "$REPORTED_SHA" --reported-bytes "$REPORTED_BYTES" --capture-key "$CAPTURE_KEY" --captured-at "$CAPTURED_AT" --archive-key "$ARCHIVE_KEY" --report-key "$REPORT_KEY" --commit-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --bucket "$BACKUP_S3_BUCKET" --etag "$ETAG" --version-id "$VERSION_ID" --trigger-type "$TRIGGER_TYPE" --out "$RUNNER_TEMP/nexus-backup/receipt.json"
          s3 s3 cp "$RUNNER_TEMP/nexus-backup/receipt.json" "s3://$BACKUP_S3_BUCKET/$RECEIPT_KEY" --only-show-errors

      - name: Independently retrieve and validate stored receipt and report
        if: success()
        shell: bash
        env:
          CAPTURE_KEY: ${{ steps.keys.outputs.capture_key }}
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
          REPORT_KEY: ${{ steps.keys.outputs.report_key }}
          RECEIPT_KEY: ${{ steps.keys.outputs.receipt_key }}
          REPORTED_SHA: ${{ steps.upload.outputs.source_sha256 }}
          REPORTED_BYTES: ${{ steps.upload.outputs.source_bytes }}
        run: |
          set -euo pipefail
          s3() { if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then aws "$@" --endpoint-url "$BACKUP_S3_ENDPOINT"; else aws "$@"; fi; }
          CHECK_DIR="$(mktemp -d "$RUNNER_TEMP/nexus-receipt-check-XXXXXX")"
          s3 s3api get-object --bucket "$BACKUP_S3_BUCKET" --key "$RECEIPT_KEY" "$CHECK_DIR/receipt.json" > /dev/null
          s3 s3api get-object --bucket "$BACKUP_S3_BUCKET" --key "$REPORT_KEY" "$CHECK_DIR/verification.json" > /dev/null
          python3 scripts/backup-receipt.py validate --receipt "$CHECK_DIR/receipt.json" --report "$CHECK_DIR/verification.json" --expected-sha256 "$REPORTED_SHA" --expected-bytes "$REPORTED_BYTES" --capture-key "$CAPTURE_KEY" --archive-key "$ARCHIVE_KEY" --report-key "$REPORT_KEY" --commit-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          {
            echo "## Verified backup captured"
            echo "- Capture key: `$CAPTURE_KEY`"
            echo "- Archive key: `$ARCHIVE_KEY`"
            echo "- Bytes: $REPORTED_BYTES"
            echo "- SHA-256: `$REPORTED_SHA`"
            echo "- Independent retrieval, digest, byte count, recovery-point report and stored receipt all verified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inventory retained recovery points and flag excess
        if: success()
        shell: bash
        env:
          RETENTION_TARGET: "30"
        run: |
          set -euo pipefail
          s3() { if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then aws "$@" --endpoint-url "$BACKUP_S3_ENDPOINT"; else aws "$@"; fi; }
          # Retention policy: keep 30 daily recovery points. This step NEVER deletes;
          # excess is only counted and flagged for operator review (BACKUP_POLICY_DRAFT).
          # Single listing page covers up to 1000 keys (about three years of daily points).
          if ! s3 s3api list-objects-v2 --bucket "$BACKUP_S3_BUCKET" --prefix "nexus-forge/live/" --output json > "$RUNNER_TEMP/nexus-backup/retention-live.json" 2>"$RUNNER_TEMP/nexus-backup/retention.err"; then
            echo "::warning::Retention inventory listing failed; the verified capture above is unaffected. Nothing was deleted."
            exit 0
          fi
          if ! s3 s3api list-objects-v2 --bucket "$BACKUP_S3_BUCKET" --prefix "nexus-forge/receipts/" --output json > "$RUNNER_TEMP/nexus-backup/retention-receipts.json" 2>>"$RUNNER_TEMP/nexus-backup/retention.err"; then
            echo "::warning::Receipt inventory listing failed; the verified capture above is unaffected. Nothing was deleted."
            exit 0
          fi
          POINTS="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get("Contents") or []))' "$RUNNER_TEMP/nexus-backup/retention-live.json")"
          RECEIPTS="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get("Contents") or []))' "$RUNNER_TEMP/nexus-backup/retention-receipts.json")"
          [[ "$POINTS" =~ ^[0-9]+$ && "$RECEIPTS" =~ ^[0-9]+$ ]] || { echo "::error::Retention inventory could not be counted."; exit 1; }
          {
            echo "## Recovery-point retention inventory"
            echo "- Live archive objects: $POINTS (target: keep $RETENTION_TARGET daily recovery points)"
            echo "- Receipt objects: $RECEIPTS"
            echo "- Inventory only: nothing is deleted automatically; excess is flagged for operator review."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( POINTS > RETENTION_TARGET )); then
            echo "::warning::Recovery points exceed the ${RETENTION_TARGET}-point retention target ($POINTS stored). Excess is flagged for operator review; nothing was deleted."
          fi
