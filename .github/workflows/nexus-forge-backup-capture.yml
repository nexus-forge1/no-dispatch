name: NEXUS FORGE Verified Backup Capture

on:
  workflow_dispatch:
    inputs:
      confirm_live_export:
        description: "Confirm this workflow will export the configured Live Convex deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nexus-forge-live-backup-capture
  cancel-in-progress: false

jobs:
  capture-verify-store:
    if: ${{ inputs.confirm_live_export == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.BACKUP_S3_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
    steps:
      - name: Checkout backup verifier
        uses: actions/checkout@v4

      - name: Require explicitly configured private backup destination
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CONVEX_DEPLOY_KEY" ]] || { echo "::error::Missing Actions secret CONVEX_DEPLOY_KEY"; exit 1; }
          [[ -n "$BACKUP_S3_BUCKET" ]] || { echo "::error::Missing Actions variable BACKUP_S3_BUCKET"; exit 1; }
          [[ -n "$AWS_ACCESS_KEY_ID" ]] || { echo "::error::Missing Actions secret BACKUP_S3_ACCESS_KEY_ID"; exit 1; }
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] || { echo "::error::Missing Actions secret BACKUP_S3_SECRET_ACCESS_KEY"; exit 1; }
          [[ -n "$AWS_REGION" ]] || { echo "::error::Missing Actions variable BACKUP_S3_REGION"; exit 1; }
          echo "Required settings are present; values are not printed."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export configured Live Convex deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexus-backup"
          npx --yes convex@1.41.0 export --include-file-storage --path "$RUNNER_TEMP/nexus-backup/source.zip" --prod
          test -s "$RUNNER_TEMP/nexus-backup/source.zip"

      - name: Prepare unique private object keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          CAPTURED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CAPTURE_KEY="live-${CAPTURED_AT//:/}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "captured_at=$CAPTURED_AT" >> "$GITHUB_OUTPUT"
          echo "capture_key=$CAPTURE_KEY" >> "$GITHUB_OUTPUT"
          echo "archive_key=nexus-forge/live/$CAPTURE_KEY.zip" >> "$GITHUB_OUTPUT"
          echo "receipt_key=nexus-forge/receipts/$CAPTURE_KEY.json" >> "$GITHUB_OUTPUT"

      - name: Upload archive to private S3-compatible storage
        shell: bash
        env:
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
        run: |
          set -euo pipefail
          if [[ -n "$BACKUP_S3_ENDPOINT" ]]; then
            aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "$RUNNER_TEMP/nexus-backup/source.zip" "s3://$BACKUP_S3_BUCKET/$ARCHIVE_KEY" --only-show-errors
          else
            aws s3 cp "$RUNNER_TEMP/nexus-backup/source.zip" "s3://$BACKUP_S3_BUCKET/$ARCHIVE_KEY" --only-show-errors
          fi

      - name: Independently retrieve saved archive and verify exact bytes
        id: integrity
        shell: bash
        env:
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
        run: |
          set -euo pipefail
          if [[ -n "$BACKUP_S3_ENDPOINT" ]]; then
            aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "s3://$BACKUP_S3_BUCKET/$ARCHIVE_KEY" "$RUNNER_TEMP/nexus-backup/retrieved.zip" --only-show-errors
          else
            aws s3 cp "s3://$BACKUP_S3_BUCKET/$ARCHIVE_KEY" "$RUNNER_TEMP/nexus-backup/retrieved.zip" --only-show-errors
          fi
          test -s "$RUNNER_TEMP/nexus-backup/retrieved.zip"
          cmp --silent "$RUNNER_TEMP/nexus-backup/source.zip" "$RUNNER_TEMP/nexus-backup/retrieved.zip"
          SOURCE_SHA="$(sha256sum "$RUNNER_TEMP/nexus-backup/source.zip" | cut -d ' ' -f 1)"
          RETRIEVED_SHA="$(sha256sum "$RUNNER_TEMP/nexus-backup/retrieved.zip" | cut -d ' ' -f 1)"
          [[ "$SOURCE_SHA" == "$RETRIEVED_SHA" ]]
          echo "sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c '%s' "$RUNNER_TEMP/nexus-backup/retrieved.zip")" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP structure, tables, relationships and freshness
        shell: bash
        env:
          CAPTURED_AT: ${{ steps.keys.outputs.captured_at }}
          EXPECTED_SHA256: ${{ steps.integrity.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/check-recovery-point.py \
            --archive "$RUNNER_TEMP/nexus-backup/retrieved.zip" \
            --source "$RUNNER_TEMP/nexus-backup/source.zip" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --captured-at "$CAPTURED_AT" \
            --report "$RUNNER_TEMP/nexus-backup/verification.json"

      - name: Upload verification report
        shell: bash
        env:
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
        run: |
          set -euo pipefail
          if [[ -n "$BACKUP_S3_ENDPOINT" ]]; then
            aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "$RUNNER_TEMP/nexus-backup/verification.json" "s3://$BACKUP_S3_BUCKET/$ARCHIVE_KEY.verification.json" --only-show-errors
          else
            aws s3 cp "$RUNNER_TEMP/nexus-backup/verification.json" "s3://$BACKUP_S3_BUCKET/$ARCHIVE_KEY.verification.json" --only-show-errors
          fi

      - name: Write receipt only after capture and retrieval checks pass
        shell: bash
        env:
          CAPTURED_AT: ${{ steps.keys.outputs.captured_at }}
          CAPTURE_KEY: ${{ steps.keys.outputs.capture_key }}
          ARCHIVE_KEY: ${{ steps.keys.outputs.archive_key }}
          RECEIPT_KEY: ${{ steps.keys.outputs.receipt_key }}
          ARCHIVE_SHA256: ${{ steps.integrity.outputs.sha256 }}
          ARCHIVE_BYTES: ${{ steps.integrity.outputs.bytes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RECEIPT_PATH: ${{ runner.temp }}/nexus-backup/receipt.json
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const receipt = {
              schemaVersion: 1,
              captureKey: process.env.CAPTURE_KEY,
              sourceEnvironment: "live",
              triggerType: "manual",
              capturedAt: process.env.CAPTURED_AT,
              archiveObjectKey: process.env.ARCHIVE_KEY,
              verificationObjectKey: process.env.ARCHIVE_KEY + ".verification.json",
              sha256: process.env.ARCHIVE_SHA256,
              bytes: Number(process.env.ARCHIVE_BYTES),
              independentlyRetrieved: true,
              byteIdenticalAfterRetrieval: true,
              archiveVerificationPassed: true,
              workflowRunUrl: process.env.RUN_URL,
              workflowRunId: process.env.RUN_ID,
              note: "Database export only. This receipt does not claim uploaded application files or other external media were backed up."
            };
            if (!/^[a-f0-9]{64}$/.test(receipt.sha256) || !Number.isSafeInteger(receipt.bytes) || receipt.bytes <= 0) {
              throw new Error("Receipt metadata failed validation");
            }
            fs.writeFileSync(process.env.RECEIPT_PATH, JSON.stringify(receipt, null, 2) + "\n", { flag: "wx", mode: 0o600 });
          '
          if [[ -n "$BACKUP_S3_ENDPOINT" ]]; then
            aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "$RUNNER_TEMP/nexus-backup/receipt.json" "s3://$BACKUP_S3_BUCKET/$RECEIPT_KEY" --only-show-errors
          else
            aws s3 cp "$RUNNER_TEMP/nexus-backup/receipt.json" "s3://$BACKUP_S3_BUCKET/$RECEIPT_KEY" --only-show-errors
          fi
