name: NEXUS FORGE Delivery

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: 'NEXUS FORGE mission ID'
        required: true
        type: string
      delivery_id:
        description: 'NEXUS FORGE delivery ID'
        required: true
        type: string
      callback_origin:
        description: 'Originating managed Convex callback origin'
        required: false
        type: string
      artifact_ref:
        description: 'Delivered artifact path'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CONVEX_SITE_URL: ${{ inputs.callback_origin || secrets.CONVEX_SITE_URL }}
  NEXUS_FORGE_DELIVERY_SECRET: ${{ secrets.NEXUS_FORGE_DELIVERY_SECRET }}

concurrency:
  group: nexus-forge-pages
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate callback origin
        run: |
          case "$CONVEX_SITE_URL" in
            https://quick-rabbit-810.eu-west-1.convex.site|https://tame-rat-826.eu-west-1.convex.site) ;;
            *) echo "Callback origin is not allowlisted"; exit 1 ;;
          esac
      - name: Checkout delivered artifact
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate delivered artifact
        env:
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
        run: |
          test -s "$ARTIFACT_REF"
          grep -qi '<html' "$ARTIFACT_REF"
          grep -qi '<script' "$ARTIFACT_REF"
          echo "Delivered artifact validated: $ARTIFACT_REF"

      - name: Build platform
        run: npm run build

      - name: Test platform
        run: npm test -- --run

      - name: Persist successful build/test result to Convex
        env:
          DELIVERY_ID: ${{ inputs.delivery_id }}
          MISSION_ID: ${{ inputs.mission_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ -n "$CONVEX_SITE_URL" ]] || { echo "Missing GitHub Actions secret: CONVEX_SITE_URL"; exit 1; }
          [[ -n "$NEXUS_FORGE_DELIVERY_SECRET" ]] || { echo "Missing GitHub Actions secret: NEXUS_FORGE_DELIVERY_SECRET"; exit 1; }
          payload=$(node -e 'console.log(JSON.stringify({deliveryId:process.env.DELIVERY_ID,conclusion:"success",runUrl:process.env.RUN_URL,commitSha:process.env.COMMIT_SHA,summary:"Mission "+process.env.MISSION_ID+"; delivered artifact validation, platform build, and tests passed."}))')
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$CONVEX_SITE_URL/github-actions/delivery-result" \
            -H "Authorization: Bearer $NEXUS_FORGE_DELIVERY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Convex response ($STATUS): $(cat /tmp/response.json)"
          [[ "$STATUS" == "200" ]] || { echo "Failed to persist successful build/test result to Convex"; exit 1; }

      - name: Prepare static deployment
        env:
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
        run: |
          rm -rf site
          mkdir -p site
          cp "$ARTIFACT_REF" site/index.html
          cat > site/404.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>NEXUS FORGE</title></head><body><p>Page not found.</p></body></html>
          EOF
          test -s site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" | grep -qi '<html'; then
              echo "Live deployment verified: $PAGE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Live deployment verification failed: $PAGE_URL"
          exit 1

      - name: Persist deployment result to Convex
        env:
          DELIVERY_ID: ${{ inputs.delivery_id }}
          MISSION_ID: ${{ inputs.mission_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          [[ -n "$CONVEX_SITE_URL" ]] || { echo "Missing GitHub Actions secret: CONVEX_SITE_URL"; exit 1; }
          [[ -n "$NEXUS_FORGE_DELIVERY_SECRET" ]] || { echo "Missing GitHub Actions secret: NEXUS_FORGE_DELIVERY_SECRET"; exit 1; }
          payload=$(node -e 'console.log(JSON.stringify({deliveryId:process.env.DELIVERY_ID,conclusion:"success",runUrl:process.env.RUN_URL,commitSha:process.env.COMMIT_SHA,deploymentUrl:process.env.PAGE_URL,summary:`Mission ${process.env.MISSION_ID}; artifact built, tested, deployed to GitHub Pages, and live URL smoke-verified.`}))')
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$CONVEX_SITE_URL/github-actions/deployment-result" \
            -H "Authorization: Bearer $NEXUS_FORGE_DELIVERY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Convex response ($STATUS): $(cat /tmp/response.json)"
          [[ "$STATUS" == "200" ]] || { echo "Failed to persist deployment result to Convex"; exit 1; }

      - name: Delivery evidence
        if: ${{ always() }}
        run: |
          echo "NEXUS FORGE delivery checks completed."
          echo "Commit: $GITHUB_SHA"
          echo "Mission: ${{ inputs.mission_id }}"
          echo "Delivery: ${{ inputs.delivery_id }}"
          echo "Artifact: ${{ inputs.artifact_ref }}"
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"

  delivery-failure:
    runs-on: ubuntu-latest
    needs: build-test-deploy
    if: ${{ failure() }}
    steps:
      - name: Validate callback origin
        run: |
          case "$CONVEX_SITE_URL" in
            https://quick-rabbit-810.eu-west-1.convex.site|https://tame-rat-826.eu-west-1.convex.site) ;;
            *) echo "Callback origin is not allowlisted"; exit 1 ;;
          esac
      - name: Report failed delivery to Convex
        env:
          DELIVERY_ID: ${{ inputs.delivery_id }}
          MISSION_ID: ${{ inputs.mission_id }}
        run: |
          [[ -n "$CONVEX_SITE_URL" ]] || { echo "Missing GitHub Actions secret: CONVEX_SITE_URL"; exit 1; }
          [[ -n "$NEXUS_FORGE_DELIVERY_SECRET" ]] || { echo "Missing GitHub Actions secret: NEXUS_FORGE_DELIVERY_SECRET"; exit 1; }
          payload=$(node -e 'console.log(JSON.stringify({deliveryId:process.env.DELIVERY_ID,conclusion:"failure",runUrl:"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",commitSha:"${{ github.sha }}",summary:`Mission ${process.env.MISSION_ID}; delivery build/test/deployment workflow failed.`}))')
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$CONVEX_SITE_URL/github-actions/delivery-result" \
            -H "Authorization: Bearer $NEXUS_FORGE_DELIVERY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Convex response ($STATUS): $(cat /tmp/response.json)"
          [[ "$STATUS" == "200" ]] || { echo "Failed to persist delivery failure to Convex"; exit 1; }
